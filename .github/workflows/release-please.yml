name: Release

# Automated releases via release-please. On every push to main it opens (or
# updates) a "release" pull request that bumps the version and updates the
# changelog from the commit history, then this workflow merges that PR
# immediately (no branch protection on main requiring checks first — the code
# itself was already tested on its own PR before landing on main; the release
# PR only touches the version + changelog). That merge is what tags vX.Y.Z and
# creates the GitHub release. Commit messages follow Conventional Commits
# (feat:, fix:, refactor:, docs:, ...) so the version bump is derived
# automatically.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --merge --repo ${{ github.repository }} ${{ fromJSON(steps.release.outputs.pr).number }}
